services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-job_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://job_tracker:change-me-for-production@postgres:5432/job_tracker}
      APP_ENV: ${APP_ENV:-development}
      SESSION_HOURS: ${SESSION_HOURS:-24}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-job_tracker_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SEED_JOBSEEKER1_PASSWORD: ${SEED_JOBSEEKER1_PASSWORD:-exam-jobseeker1}
      SEED_JOBSEEKER2_PASSWORD: ${SEED_JOBSEEKER2_PASSWORD:-exam-jobseeker2}
      SEED_MAINTAINER_PASSWORD: ${SEED_MAINTAINER_PASSWORD:-exam-maintainer}
      EVIDENCE_ROOT: /evidence
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./evidence:/evidence
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:
